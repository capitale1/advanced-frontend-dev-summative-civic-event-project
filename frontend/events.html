<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | CivicEvents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-paper text-ink font-sans min-h-screen flex flex-col">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
      <div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Events</h1>
        <p class="text-muted mt-1">Public meetings, clean-up days and community gatherings.</p>
      </div>
      <!-- ROLE GUARD (element): only admins see this -->
      <a href="event-form.html" data-requires="admin" class="hidden btn btn-primary">Create event</a>
    </div>

    <form id="filters" class="card p-4 mb-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-[2fr_1fr_1fr_1fr_auto] items-end" aria-label="Filter events" role="search">
      <div>
        <label for="f-q" class="label">Search</label>
        <input id="f-q" type="search" class="input" placeholder="Title, description or place">
      </div>
      <div>
        <label for="f-when" class="label">Show</label>
        <select id="f-when" class="input">
          <option value="upcoming">Upcoming</option>
          <option value="past">Past</option>
          <option value="all">All dates</option>
        </select>
      </div>
      <div>
        <label for="f-date" class="label">On date</label>
        <input id="f-date" type="date" class="input">
      </div>
      <div>
        <label for="f-location" class="label">Location</label>
        <select id="f-location" class="input">
          <option value="">Anywhere</option>
        </select>
      </div>
      <button id="f-reset" type="button" class="btn btn-secondary">Clear filters</button>
    </form>

    <p id="results-count" tabindex="-1" class="text-sm text-muted mb-4" aria-live="polite"></p>
    <div id="events-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    <nav id="pagination" aria-label="Event pages" class="mt-8"></nav>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/events.js"></script>
</body>
</html>
