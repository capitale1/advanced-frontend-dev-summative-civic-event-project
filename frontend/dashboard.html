<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | CivicEvents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-paper text-ink font-sans min-h-screen flex flex-col">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <!-- ROLE GUARD (page): admin only, enforced by Auth.requireAdmin() in dashboard.js -->
    <div class="grid gap-6 lg:gap-10 lg:grid-cols-[190px_1fr]">
      <div id="admin-sidebar"></div>
      <div class="min-w-0">

        <div class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Dashboard</h1>
            <p class="text-muted mt-1" aria-live="polite"><span id="updated">Loading the latest numbers…</span></p>
          </div>
          <button id="refresh-btn" type="button" class="btn btn-secondary">Refresh</button>
        </div>
        <div id="stats" class="grid gap-4 grid-cols-2 xl:grid-cols-4 mt-6" aria-busy="true"></div>
        <div id="charts" class="grid gap-6 lg:grid-cols-2 mt-6"></div>

      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/dashboard.js"></script>
</body>
</html>
