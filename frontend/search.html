<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search | CivicEvents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-paper text-ink font-sans min-h-screen flex flex-col">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1 w-full max-w-4xl mx-auto px-4 sm:px-6 py-8">
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Search</h1>
    <form id="search-form" role="search" class="mt-4 flex gap-2" action="search.html">
      <label for="q" class="sr-only">Search events, announcements and promos</label>
      <input id="q" name="q" type="search" class="input" placeholder="Search events, announcements and promos">
      <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <p id="results-count" tabindex="-1" class="text-sm text-muted mt-6" aria-live="polite"></p>
    <div id="results" class="mt-4 space-y-8"></div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/search.js"></script>
</body>
</html>
