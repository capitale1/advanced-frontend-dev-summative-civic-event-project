<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile | CivicEvents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-paper text-ink font-sans min-h-screen flex flex-col">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1 w-full max-w-3xl mx-auto px-4 sm:px-6 py-8">
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">My profile</h1>
    <p class="text-muted mt-1">Your account details and activity.</p>

    <section id="summary" class="card p-5 sm:p-6 mt-6 border-t-4 border-t-signal" aria-labelledby="summary-heading" aria-busy="true">
      <h2 id="summary-heading" class="sr-only">Account summary</h2>
      <div class="flex items-center gap-4"><div class="skeleton h-16 w-16 rounded-full"></div><div class="flex-1 space-y-2"><div class="skeleton h-5 w-1/2"></div><div class="skeleton h-4 w-1/3"></div></div></div>
    </section>

    <section class="mt-6" aria-labelledby="activity-heading">
      <h2 id="activity-heading" class="text-xl font-bold">Your activity</h2>
      <div id="activity" class="grid gap-4 grid-cols-2 sm:grid-cols-3 mt-3"></div>
    </section>

    <section class="mt-8" aria-labelledby="edit-heading">
      <h2 id="edit-heading" class="text-xl font-bold">Edit your details</h2>
      <form id="profile-form" class="card p-5 sm:p-6 mt-3 space-y-5" novalidate>
        <div data-form-alert role="alert" class="hidden rounded-md border border-danger/30 bg-red-50 text-danger px-4 py-3 text-sm"></div>
        <div>
          <label for="full_name" class="label">Full name</label>
          <input id="full_name" type="text" autocomplete="name" class="input" disabled>
          <p id="full_name-error" class="field-error hidden"></p>
        </div>
        <div>
          <label for="email" class="label">Email</label>
          <input id="email" type="email" autocomplete="email" class="input" disabled aria-describedby="email-help">
          <p id="email-help" class="text-xs text-muted mt-1">You'll use this email to sign in.</p>
          <p id="email-error" class="field-error hidden"></p>
        </div>
        <div class="grid gap-5 sm:grid-cols-2">
          <div>
            <p class="label">Role</p>
            <p id="role-text" class="text-sm">&nbsp;</p>
          </div>
          <div>
            <p class="label">Account status</p>
            <p id="status-text" class="text-sm">&nbsp;</p>
          </div>
        </div>
        <p class="text-xs text-muted">Your role and account status are managed by administrators and can't be changed here.</p>
        <div class="pt-2 border-t border-ink/10">
          <button id="save-btn" type="submit" class="btn btn-primary mt-4" disabled>Save changes</button>
        </div>
      </form>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/profile.js"></script>
</body>
</html>
